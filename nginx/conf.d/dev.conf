# Phase 4 NCP dev 배포 reverse proxy (docs/features/ncp-dev-deployment.md §5-1).
#
# 1차 단계: 도메인 미발급. NCP VM IP (101.79.20.94) 직접 접근.
# 흐름:
#   GET /_nginx_health   → 200 (nginx 자체 헬스체크용)
#   GET /api/...         → backend:8080 (Spring Boot)
#   GET /actuator/health/liveness   → backend:8081 (CD/container probe 용, 외부 노출 허용)
#   GET /actuator/health/readiness  → backend:8081 (CD/container probe 용, 외부 노출 허용)
#   GET /actuator/* (그 외)         → 404 (metrics/prometheus 등 내부 endpoint 외부 차단, 이슈 #395)
#   기타 모든 path       → web:3000 (Next.js)
#
# SSL 미적용 (1차). 도메인 발급 후 별 PR 에서 Cloudflare Origin CA 또는 Let's Encrypt.

upstream backend_upstream {
    server backend:8080 max_fails=3 fail_timeout=10s;
}

# Spring management.server.port=8081 (application.yml).
# /actuator/* 는 별도 management port 로 proxy.
upstream backend_actuator_upstream {
    server backend:8081 max_fails=3 fail_timeout=10s;
}

upstream web_upstream {
    server web:3000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80 default_server;
    server_name _;

    # nginx 자체 헬스체크 — docker healthcheck 대상.
    location = /_nginx_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Spring Boot API.
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Actuator — metrics/prometheus 등 내부 endpoint 는 외부 차단 (이슈 #395, defense in depth).
    # whitelist: CD/container probe 용 health/liveness, health/readiness 만 통과.
    # management.server.port=8081 (application.yml) — 별 upstream.
    # 그 외 /actuator/* 는 404 (Spring exposure 도 base profile 에서 health,info 로 축소됨).
    location = /actuator/health/liveness {
        proxy_pass http://backend_actuator_upstream/actuator/health/liveness;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location = /actuator/health/readiness {
        proxy_pass http://backend_actuator_upstream/actuator/health/readiness;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location /actuator/ {
        access_log off;
        return 404;
    }

    # Next.js (catch-all). _next/static, public 자원 포함.
    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # Next.js standalone 의 streaming/HMR 호환.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
