# Phase 4 NCP dev 배포 reverse proxy (docs/features/ncp-dev-deployment.md §5-1).
#
# 1차 단계: 도메인 미발급. NCP VM IP (101.79.20.94) 직접 접근.
# 흐름:
#   GET /_nginx_health   → 200 (nginx 자체 헬스체크용)
#   GET /api/...         → backend:8080 (Spring Boot)
#   GET /actuator/...    → backend:8080 (관리 endpoint, 운영자 직접 호출용)
#   기타 모든 path       → web:3000 (Next.js)
#
# SSL 미적용 (1차). 도메인 발급 후 별 PR 에서 Cloudflare Origin CA 또는 Let's Encrypt.

upstream backend_upstream {
    server backend:8080 max_fails=3 fail_timeout=10s;
}

upstream web_upstream {
    server web:3000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80 default_server;
    server_name _;

    # nginx 자체 헬스체크 — docker healthcheck 대상.
    location = /_nginx_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Spring Boot API.
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Actuator (admin token 게이트는 Spring 측에서 처리).
    location /actuator/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # Next.js (catch-all). _next/static, public 자원 포함.
    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # Next.js standalone 의 streaming/HMR 호환.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
