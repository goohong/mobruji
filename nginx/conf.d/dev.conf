# Phase 4 NCP dev 배포 reverse proxy (docs/features/ncp-dev-deployment.md §5-1).
#
# 1차 단계: 도메인 미발급. NCP VM IP (101.79.20.94) 직접 접근.
# 흐름:
#   GET /_nginx_health   → 200 (nginx 자체 헬스체크용)
#   GET /api/...         → backend:8080 (Spring Boot)
#   GET /actuator/health/liveness   → backend:8081 (CD/container probe 용, 외부 노출 허용)
#   GET /actuator/health/readiness  → backend:8081 (CD/container probe 용, 외부 노출 허용)
#   GET /actuator/* (그 외)         → 404 (metrics/prometheus 등 내부 endpoint 외부 차단, 이슈 #395)
#   기타 모든 path       → web:3000 (Next.js)
#
# SSL 미적용 (1차). 도메인 발급 후 별 PR 에서 Cloudflare Origin CA 또는 Let's Encrypt.

# DNS resolver: Docker 내부 DNS (127.0.0.11) — backend/web container 가 재기동되어
# 새 IP 가 할당되어도 nginx 가 30초 내 자동 인식. `proxy_pass` 를 변수 패턴으로
# 두어야 매 request DNS lookup 이 실행됨 (default upstream 블록은 기동 시 1회
# resolve 후 영구 캐시 → stale IP 사고). 상세: docs/features/nginx-dns-resolver-pattern.md.
resolver 127.0.0.11 valid=30s ipv6=off;
resolver_timeout 5s;

server {
    listen 80 default_server;
    server_name _;

    # nginx 자체 헬스체크 — docker healthcheck 대상.
    location = /_nginx_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Spring Boot API.
    # 변수 패턴 사용 — `set $upstream ...` 으로 nginx 가 매 request 마다 DNS lookup.
    location /api/ {
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Actuator — metrics/prometheus 등 내부 endpoint 는 외부 차단 (이슈 #395, defense in depth).
    # whitelist: CD/container probe 용 health/liveness, health/readiness 만 통과.
    # management.server.port=8081 (application.yml) — 별 management port 로 proxy.
    # 그 외 /actuator/* 는 404 (Spring exposure 도 base profile 에서 health,info 로 축소됨).
    location = /actuator/health/liveness {
        set $upstream_backend_actuator http://backend:8081;
        proxy_pass $upstream_backend_actuator/actuator/health/liveness;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location = /actuator/health/readiness {
        set $upstream_backend_actuator http://backend:8081;
        proxy_pass $upstream_backend_actuator/actuator/health/readiness;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location /actuator/ {
        access_log off;
        return 404;
    }

    # Next.js (catch-all). _next/static, public 자원 포함.
    location / {
        set $upstream_web http://web:3000;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # Next.js standalone 의 streaming/HMR 호환.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
