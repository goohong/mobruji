# Phase 4 NCP dev 배포 reverse proxy (docs/features/ncp-dev-deployment.md §5-1).
#
# HTTPS 전환: ADR-0028 (nip.io wildcard DNS + Let's Encrypt HTTP-01).
#   호스트네임: 101-79-20-94.nip.io → 101.79.20.94 (nip.io 무료 wildcard DNS).
#   인증서:     Let's Encrypt, HTTP-01 challenge (/.well-known/acme-challenge/ 80포트 노출).
#   최초 발급:  tools/deploy/dev-tls-init.sh (1회). 갱신: docker-compose.dev.yml certbot container.
#
# 흐름:
#   GET /_nginx_health               → 200 (nginx 자체 헬스체크용, 80/443 양쪽)
#   GET /.well-known/acme-challenge/* → webroot (ACME HTTP-01, 80 만)
#   80 그 외 path                    → 301 https://$host$request_uri (HTTPS 강제)
#   GET /api/...                     → backend:8080 (Spring Boot)
#   GET /actuator/health/liveness    → backend:8081 (CD/container probe, 외부 노출 허용)
#   GET /actuator/health/readiness   → backend:8081 (CD/container probe, 외부 노출 허용)
#   GET /actuator/* (그 외)          → 404 (metrics/prometheus 등 내부 endpoint 차단, 이슈 #395)
#   기타 모든 path                   → web:3000 (Next.js)
#
# prod 도메인(dev.mobruji.app) v0.4 발급 시 본 conf 폐기 — server_name + env 2곳만 교체 (ADR-0028).

# DNS resolver: Docker 내부 DNS (127.0.0.11) — backend/web container 가 재기동되어
# 새 IP 가 할당되어도 nginx 가 30초 내 자동 인식. `proxy_pass` 를 변수 패턴으로
# 두어야 매 request DNS lookup 이 실행됨 (default upstream 블록은 기동 시 1회
# resolve 후 영구 캐시 → stale IP 사고). 상세: docs/features/nginx-dns-resolver-pattern.md.
resolver 127.0.0.11 valid=30s ipv6=off;
resolver_timeout 5s;

# ── 80포트: ACME challenge + HTTPS 리다이렉트 ──────────────────────────────
server {
    listen 80 default_server;
    server_name 101-79-20-94.nip.io;

    # nginx 자체 헬스체크 — docker healthcheck 대상 (리다이렉트 전 200).
    location = /_nginx_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Let's Encrypt HTTP-01 challenge — certbot 이 webroot 에 쓴 토큰을 80 으로 서빙.
    # 80 은 닫을 수 없음 (ACME 도달성 요구, ADR-0028 Consequences).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 그 외 모든 path 는 HTTPS 로 강제 리다이렉트.
    # $host 가 아니라 **인증서 valid 한 canonical 호스트(nip.io)** 로 보낸다 — raw IP
    # (http://101.79.20.94)로 들어오면 $host=IP 라 https://<IP> 로 보내져 인증서
    # 불일치(cert=nip.io)로 연결 실패하던 사고 fix (#1586). IP 로 와도 nip.io 로 안착.
    location / {
        return 301 https://101-79-20-94.nip.io$request_uri;
    }
}

# ── 443포트: 애플리케이션 (secure context) ────────────────────────────────
server {
    listen 443 ssl default_server;
    http2 on;
    server_name 101-79-20-94.nip.io;

    ssl_certificate     /etc/letsencrypt/live/101-79-20-94.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/101-79-20-94.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # HSTS 미적용 (dev) — 마이그레이션 시 origin 변경을 막지 않도록 (ADR-0028 §7).

    # nginx 자체 헬스체크 — 443 에서도 동일 (CD/local probe).
    location = /_nginx_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Spring Boot API.
    # 변수 패턴 사용 — `set $upstream ...` 으로 nginx 가 매 request 마다 DNS lookup.
    location /api/ {
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Actuator — metrics/prometheus 등 내부 endpoint 는 외부 차단 (이슈 #395, defense in depth).
    # whitelist: CD/container probe 용 health/liveness, health/readiness 만 통과.
    # management.server.port=8081 (application.yml) — 별 management port 로 proxy.
    # 그 외 /actuator/* 는 404 (Spring exposure 도 base profile 에서 health,info 로 축소됨).
    location = /actuator/health/liveness {
        set $upstream_backend_actuator http://backend:8081;
        proxy_pass $upstream_backend_actuator/actuator/health/liveness;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location = /actuator/health/readiness {
        set $upstream_backend_actuator http://backend:8081;
        proxy_pass $upstream_backend_actuator/actuator/health/readiness;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location /actuator/ {
        access_log off;
        return 404;
    }

    # Next.js (catch-all). _next/static, public 자원 포함.
    location / {
        set $upstream_web http://web:3000;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # Next.js standalone 의 streaming/HMR 호환.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
