# test 프로파일은 Spring Security 미도입 단계에서 결정적 token 사용 (#224 #228).
# 실제 token 값은 의미 없음 — 테스트가 동일 값을 헤더로 보낸다.
# CORS 허용 origin: localhost:3000 (dev) + http://test-allowed (E2E 검증용).
# 명시되지 않은 origin(예: http://evil.example)은 framework 가 preflight 403 응답.
mobruji:
  admin:
    token: test-admin-token
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://test-allowed

spring:
  datasource:
    url: jdbc:h2:mem:mobruji-test;MODE=MySQL;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    # ADR 0009 — Flyway가 schema 단일 진실원. test도 validate로 통일.
    # H2 MODE=MySQL에서 V1__init.sql (ENGINE=InnoDB / DATETIME(6) / DOUBLE / AUTO_INCREMENT)이
    # 그대로 동작하는지 검증한다 (호환 안 되는 변경은 후속 PR에서 db/migration/h2/ 분리 가능 — ADR 0009).
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
  sql:
    init:
      mode: never
