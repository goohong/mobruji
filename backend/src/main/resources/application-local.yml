spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/mobruji?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:mobruji}
    password: ${MYSQL_PASSWORD:mobruji}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # ADR 0009 — Flyway가 schema 단일 진실원. local도 validate로 통일.
    # 엔티티 변경 시 db/migration/V{N}__*.sql를 같이 추가해야 한다.
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 기존 로컬 DB(ddl-auto=update로 만들어진)에 Flyway를 처음 도입하는 경우 대비.
    baseline-on-migrate: true
    baseline-version: 0
