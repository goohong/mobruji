spring:
  application:
    name: mobruji-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8080}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# 추천 v1 점수 가중치 / 다양성 캡 / 결과 개수.
# spec: docs/features/recommendation-algorithm-v1.md §9
# - voiceFit 0.5: 음역 적합이 1순위
# - genre 0.2:    v1에서 입력 신호 없음(가중치만 보존)
# - mood 0.2:     분위기 일치 가산
# - popularity 0.1: 모든 곡 popularity=1.0 (시드에 컬럼 없음) → 동일 가산
recommendation:
  weights:
    voice-fit: 0.5
    genre: 0.2
    mood: 0.2
    popularity: 0.1
  diversity:
    max-same-artist: 2
    max-same-genre: 4
  result-count: 10
  jitter-magnitude: 0.01
  # spec §3 비기능 — 결정성: 같은 입력 → 같은 결과.
  # derived(기본): 요청 파라미터 해시에서 seed 도출.
  # random: 디버깅용 비결정 변주(운영 사용 금지).
  seed-strategy: derived

# Python audio analysis tool (tools/audio-analysis/analyze.py) 호출 설정.
# spec: docs/features/audio-tooling-bootstrap.md §3
# - python-cmd: 실행 명령. 로컬 venv 사용 시 절대경로 또는 환경변수로 override.
# - tool-dir:  analyze.py 가 위치한 디렉터리. 운영/컨테이너에서는 마운트 경로로 override.
# - timeout:   외부 process 최대 대기 시간. 곡당 분석 목표 30s + 마진.
audio:
  analysis:
    python-cmd: ${AUDIO_ANALYSIS_PYTHON_CMD:python3}
    tool-dir: ${AUDIO_ANALYSIS_TOOL_DIR:../tools/audio-analysis}
    timeout: 60s
    # use-docker=true 시 호스트 Python 대신 docker compose 컨테이너에서 실행 (spec PR D).
    # 기본 false — 호스트 Python 사용 (CI/로컬 venv).
    use-docker: ${AUDIO_ANALYSIS_USE_DOCKER:false}
    docker-compose-file: ${AUDIO_ANALYSIS_COMPOSE_FILE:../docker-compose.audio.yml}
    docker-compose-service: ${AUDIO_ANALYSIS_COMPOSE_SERVICE:audio-analysis}
