spring:
  application:
    name: mobruji-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  # @Scheduled 전용 thread pool 크기 (이슈 #863).
  # default(1) 일 경우 AudioAnalysisScheduledBackfill (cron 4:00 SUN) 과
  # AlbumCoverScheduledBackfill (cron 4:30 SUN) 이 동일 스레드를 공유 — AudioAnalysisRunner
  # 곡당 60s timeout 이라 1k 곡 시 최악 60분 blocking, AlbumCover scheduled 시각 침범 위험.
  # size: 2 로 분리해 starvation 회피. 향후 @Scheduled 추가 시 재평가.
  task:
    scheduling:
      pool:
        size: 2

# Admin endpoint 보호용 임시 토큰 (v0.3 P0, #224 #228).
# 평문 yml 금지 — 환경변수 MOBRUJI_ADMIN_TOKEN 로 주입.
# blank/null 이면 부팅 실패 (admin endpoint 무인증 노출 방지).
# v0.3 후속 PR에서 Spring Security 정식 도입과 함께 제거 예정.
#
# CORS 허용 origin (rev 21 QA, #314):
# - 환경변수 MOBRUJI_CORS_ALLOWED_ORIGINS 로 쉼표 구분 주입 (예: "https://mobruji.com,https://www.mobruji.com").
# - 기본값은 로컬 Next.js dev 서버(http://localhost:3000) + NCP dev canonical origin (ADR-0028,
#   nip.io + Let's Encrypt). NCP `.env.dev` 갱신 누락 시에도 default 가 흡수하도록 두 origin
#   포함 — 추천 받기 P0 사고(#1593, https://101-79-20-94.nip.io 가 옛 env(http://101.79.20.94)
#   와 mismatch 로 403 "Invalid CORS request") 재발 가드.
#   prod 도메인(dev.mobruji.app, v0.4)으로 전환 시 env override 강제.
# - 빈 값으로 주입하면 부팅 실패 (의도치 않은 와일드카드 노출 방지).
mobruji:
  admin:
    token: ${MOBRUJI_ADMIN_TOKEN:}
  cors:
    allowed-origins: ${MOBRUJI_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://101-79-20-94.nip.io}
  # 익명 sessionId 라이프사이클 (ADR-0013, spec anonymous-session-lifecycle §5-8).
  # - ttl-days: sliding TTL (default 180 — ADR-0013 §D-1). 운영 측정 후 조정 시 본 값만 변경.
  # - cleanup-cron: 만료 batch cron (Spring 6-field). Asia/Seoul timezone.
  # - cleanup-max-per-run: batch 1회 최대 처리 sessionId 수 (부하 분산).
  # 모두 미지정 시 코드 default fallback — fail-fast 적용 안 함 (운영 안전 default 보장).
  session:
    ttl-days: ${MOBRUJI_SESSION_TTL_DAYS:180}
    cleanup-cron: ${MOBRUJI_SESSION_CLEANUP_CRON:0 0 4 * * *}
    cleanup-max-per-run: ${MOBRUJI_SESSION_CLEANUP_MAX:10000}
    # SessionActivityTracker 5분 캐시 윈도우 (PR 3, #924, spec §5-2 / §5-8).
    # 매 요청마다 AnonymousSession.lastSeenAt 을 DB UPDATE 하면 sliding TTL write 부담이 큼.
    # 같은 sessionId 가 이 간격 안에 재요청하면 in-memory 캐시 hit → DB skip.
    activity-flush-interval: ${MOBRUJI_SESSION_ACTIVITY_FLUSH_INTERVAL:PT5M}

server:
  port: ${SERVER_PORT:8080}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        # base default 는 보수적으로 health,info 만 — prod 기본값.
        # dev/local 개발자 dashboard 용 metrics/prometheus 는 application-local.yml 에서 추가.
        # 운영 환경에서 dashboard 필요해지면 별도 profile override 또는 환경변수로 명시적 활성화.
        # 이슈 #395: defense in depth — nginx whitelist 와 함께 두 곳에서 차단.
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      # liveness/readiness probe 활성화 — k8s/container 환경에서 자동 활성되지만
      # 명시적으로 켜 Docker HEALTHCHECK / nginx /actuator/health/liveness 검증 가능.
      probes:
        enabled: true

# 추천 v1/v2 점수 가중치 / 다양성 캡 / 결과 개수 / tempo 설정.
# spec: docs/features/recommendation-algorithm-v1.md §9
# - voiceFit 0.5: 음역 적합이 1순위
# - genre 0.2:    v1에서 입력 신호 없음(가중치만 보존)
# - mood 0.3:     분위기 연속 유사도 가산 (#1485 — 이진 0.2 → 변별력 강화 위해 가중 상향)
# - popularity 0.1: 모든 곡 popularity=1.0 (시드에 컬럼 없음) → 동일 가산
# - tempoMatch 0.1: v2(#218) 신규. 곡 BPM ↔ 사용자 선호(또는 mood default) BPM 거리 기반.
recommendation:
  weights:
    voice-fit: 0.5
    genre: 0.2
    mood: 0.3
    popularity: 0.1
    tempo-match: 0.1
    generation: 0.15
  diversity:
    max-same-artist: 2
    max-same-genre: 4
  # v2(#218) tempoMatch 신호 설정.
  # distance-tolerance: |songBpm - target|가 이 값 이상이면 0, 미만이면 선형 감쇠.
  # mood-default-bpm: 사용자 preferredBpm 미입력 시 mood로 추론할 default 표.
  # fallback-bpm: mood 미입력일 때의 최후 default(없으면 tempoMatch=0.5 중립).
  tempo:
    distance-tolerance: 40
    mood-default-bpm:
      UPBEAT: 128
      CALM: 70
      EMOTIONAL: 80
      POWERFUL: 140
      GROOVY: 110
      NOSTALGIC: 90
    fallback-bpm: 110
  # #1487 generationFit 신호 설정.
  # distance-tolerance-years: |songReleaseYear - representativeYear|가 이 값 이상이면 0, 미만이면 선형 감쇠.
  # representative-year: 연령대별 "대표 시기"(그 세대가 즐겨 부르는 곡이 많이 나온 시기 추정값).
  #   곡 발매연도가 이 값에 가까울수록 가산. 연령대 미입력 시 generationFit=0(랭킹 무영향).
  generation:
    distance-tolerance-years: 15
    representative-year:
      TEENS: 2022
      TWENTIES: 2015
      THIRTIES: 2005
      FORTIES: 1995
      FIFTIES: 1985
      SIXTIES_PLUS: 1975
  result-count: 10
  jitter-magnitude: 0.01
  # spec §3 비기능 — 결정성: 같은 입력 → 같은 결과.
  # derived(기본): 요청 파라미터 해시에서 seed 도출.
  # random: 디버깅용 비결정 변주(운영 사용 금지).
  seed-strategy: derived

# 곡 카드 앨범 커버 URL backfill 설정 (이슈 #322).
# 1차 출처는 iTunes Search API (key 불필요, 즉시 호출 가능).
# - base-url: iTunes Search API 엔드포인트. 운영/테스트에서 override 가능
#             (테스트는 MockWebServer/WireMock 같은 stub 으로 교체).
# - country: 검색 country code — 한국 가요 매칭 정확도 위해 KR 기본.
# - request-timeout: 곡당 호출 timeout. iTunes 응답은 보통 < 500ms 지만 안전 마진.
# - throttle: 곡 사이 sleep — Apple 공식 rate limit 명시 없으나 1초 1 req 보수적 보호.
# - thumb-resolution: artworkUrl100 의 `100x100` 을 치환할 해상도 (기본 600x600).
album-cover:
  itunes:
    base-url: ${ITUNES_SEARCH_BASE_URL:https://itunes.apple.com/search}
    country: ${ITUNES_SEARCH_COUNTRY:KR}
    request-timeout: 5s
    throttle: 1s
    thumb-resolution: 600x600
  # 폴백 출처 (ADR 0029) — iTunes 무매칭 시 MusicBrainz release 검색 → MBID → Cover Art Archive front cover.
  # - music-brainz-base-url: release 검색 webservice 기준. 테스트는 stub 으로 override.
  # - cover-art-archive-base-url: 커버 아트 조회 기준.
  # - user-agent: MusicBrainz/CAA 약관상 contact 포함 식별 User-Agent 의무 — 환경변수로 운영 contact 주입 권장.
  # - request-timeout: 단계별 호출 timeout (MusicBrainz rate limit 보수적 고려).
  cover-art-archive:
    music-brainz-base-url: ${MUSICBRAINZ_BASE_URL:https://musicbrainz.org/ws/2}
    cover-art-archive-base-url: ${COVER_ART_ARCHIVE_BASE_URL:https://coverartarchive.org}
    user-agent: ${ALBUM_COVER_USER_AGENT:mobruji-backend/0.1 (+https://github.com/goohong/mobruji)}
    request-timeout: 5s

# Python audio analysis tool (tools/audio-analysis/analyze.py) 호출 설정.
# spec: docs/features/audio-tooling-bootstrap.md §3
# - python-cmd: 실행 명령. 로컬 venv 사용 시 절대경로 또는 환경변수로 override.
# - tool-dir:  analyze.py 가 위치한 디렉터리. 운영/컨테이너에서는 마운트 경로로 override.
# - timeout:   외부 process 최대 대기 시간. 곡당 분석 목표 30s + 마진.
audio:
  analysis:
    python-cmd: ${AUDIO_ANALYSIS_PYTHON_CMD:python3}
    tool-dir: ${AUDIO_ANALYSIS_TOOL_DIR:../tools/audio-analysis}
    timeout: 60s
    # use-docker=true 시 호스트 Python 대신 docker compose 컨테이너에서 실행 (spec PR D).
    # 기본 false — 호스트 Python 사용 (CI/로컬 venv).
    use-docker: ${AUDIO_ANALYSIS_USE_DOCKER:false}
    docker-compose-file: ${AUDIO_ANALYSIS_COMPOSE_FILE:../docker-compose.audio.yml}
    docker-compose-service: ${AUDIO_ANALYSIS_COMPOSE_SERVICE:audio-analysis}

# 곡 카탈로그 메타-only 임포트 설정 — spec docs/features/song-catalog-expansion.md PR 2 (#1496).
# 운영자가 정리한 (title, artist) 후보를 MusicBrainz(CC0) 에 질의해 메타데이터만 채워 Song upsert.
# 음역대/key/tempo 는 채우지 않고 자체 분석(#1490) 큐가 후속한다. 배치는 --mobruji.import-catalog=true 수동 trigger.
# - music-brainz-base-url: recording 검색 webservice 기준. 테스트는 stub 으로 override.
# - user-agent: MusicBrainz 약관상 contact 포함 식별 User-Agent 의무 — 환경변수로 운영 contact 주입 권장.
# - request-timeout: 곡당 호출 timeout.
# - throttle: 곡 사이 sleep — MusicBrainz anonymous 1 req/s rate limit 보수적 준수.
# - import-confidence: 임포트 곡 초기 metadataConfidence (메타만 → 음역 미상이라 낮게, spec §8 Q4 (a)).
catalog-import:
  music-brainz-base-url: ${MUSICBRAINZ_BASE_URL:https://musicbrainz.org/ws/2}
  user-agent: ${CATALOG_IMPORT_USER_AGENT:mobruji-backend/0.1 (+https://github.com/goohong/mobruji)}
  request-timeout: 5s
  throttle: 1s
  import-confidence: 0.3

# MusicBrainz Recording mbId/ISRC backfill 설정 — spec docs/features/musicbrainz-integration.md (#267/#268).
# mbId IS NULL 곡만 selective 매칭(저신뢰도 우선). 음역대/key/tempo 는 채우지 않아 추천 결정성 무영향.
# 약관 준수 — (a) contact 포함 User-Agent 의무, (b) anonymous 1 req/s rate limit, (c) 503 시 즉시 재시도 금지.
# - base-url: recording 검색/상세 webservice 기준. 테스트는 stub 으로 override.
# - user-agent: MusicBrainz 약관상 contact 포함 식별 User-Agent — 운영 contact 는 환경변수로 주입 권장.
# - request-timeout: 곡당 호출 timeout.
# - throttle: 호출 직전 per-instance sleep — 1 req/s 보다 약간 여유(1100ms).
# - max-retries / backoff: 503 응답 시 base × 2^attempt 지수 backoff, 소진 시 batch 전체 중단.
# - min-score: 채택 score 임계 (0~100). top-hit score 미만이면 lowscore skip. score/100 이 metadataConfidence.
# - search-limit: recording 검색 limit (top-hit 1위만 채택, 후보 가시성 위해 N).
# - backfill.batch-size: admin/스케줄러 1회 처리 곡 수 상한. 1.1s × N 이 최소 소요.
# - backfill.enabled: 정기 스케줄러 활성 (기본 false — 로컬/CI 자동 호출 금지, 운영자가 명시 enable). admin endpoint 무관.
# - backfill.schedule-cron: 정기 실행 cron (KST, prod 프로파일만). 기본 매일 04:00.
musicbrainz:
  base-url: ${MUSICBRAINZ_BASE_URL:https://musicbrainz.org/ws/2}
  user-agent: ${MUSICBRAINZ_USER_AGENT:mobruji-backend/0.1 (+https://github.com/goohong/mobruji)}
  request-timeout: 5s
  throttle: 1100ms
  max-retries: 3
  backoff: 1s
  min-score: 90
  search-limit: 5
  backfill:
    batch-size: 30
    enabled: ${MUSICBRAINZ_BACKFILL_ENABLED:false}
    schedule-cron: ${MUSICBRAINZ_BACKFILL_CRON:0 0 4 * * *}
