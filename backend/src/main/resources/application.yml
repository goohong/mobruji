spring:
  application:
    name: mobruji-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

# Admin endpoint 보호용 임시 토큰 (v0.3 P0, #224 #228).
# 평문 yml 금지 — 환경변수 MOBRUJI_ADMIN_TOKEN 로 주입.
# blank/null 이면 부팅 실패 (admin endpoint 무인증 노출 방지).
# v0.3 후속 PR에서 Spring Security 정식 도입과 함께 제거 예정.
#
# CORS 허용 origin (rev 21 QA, #314):
# - 환경변수 MOBRUJI_CORS_ALLOWED_ORIGINS 로 쉼표 구분 주입 (예: "https://mobruji.com,https://www.mobruji.com").
# - 기본값은 로컬 Next.js dev 서버(http://localhost:3000) — 운영 환경은 반드시 env override.
# - 빈 값으로 주입하면 부팅 실패 (의도치 않은 와일드카드 노출 방지).
mobruji:
  admin:
    token: ${MOBRUJI_ADMIN_TOKEN:}
  cors:
    allowed-origins: ${MOBRUJI_CORS_ALLOWED_ORIGINS:http://localhost:3000}

server:
  port: ${SERVER_PORT:8080}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# 추천 v1/v2 점수 가중치 / 다양성 캡 / 결과 개수 / tempo 설정.
# spec: docs/features/recommendation-algorithm-v1.md §9
# - voiceFit 0.5: 음역 적합이 1순위
# - genre 0.2:    v1에서 입력 신호 없음(가중치만 보존)
# - mood 0.2:     분위기 일치 가산
# - popularity 0.1: 모든 곡 popularity=1.0 (시드에 컬럼 없음) → 동일 가산
# - tempoMatch 0.1: v2(#218) 신규. 곡 BPM ↔ 사용자 선호(또는 mood default) BPM 거리 기반.
recommendation:
  weights:
    voice-fit: 0.5
    genre: 0.2
    mood: 0.2
    popularity: 0.1
    tempo-match: 0.1
  diversity:
    max-same-artist: 2
    max-same-genre: 4
  # v2(#218) tempoMatch 신호 설정.
  # distance-tolerance: |songBpm - target|가 이 값 이상이면 0, 미만이면 선형 감쇠.
  # mood-default-bpm: 사용자 preferredBpm 미입력 시 mood로 추론할 default 표.
  # fallback-bpm: mood 미입력일 때의 최후 default(없으면 tempoMatch=0.5 중립).
  tempo:
    distance-tolerance: 40
    mood-default-bpm:
      UPBEAT: 128
      CALM: 70
      EMOTIONAL: 80
      POWERFUL: 140
      GROOVY: 110
      NOSTALGIC: 90
    fallback-bpm: 110
  result-count: 10
  jitter-magnitude: 0.01
  # spec §3 비기능 — 결정성: 같은 입력 → 같은 결과.
  # derived(기본): 요청 파라미터 해시에서 seed 도출.
  # random: 디버깅용 비결정 변주(운영 사용 금지).
  seed-strategy: derived

# 곡 카드 앨범 커버 URL backfill 설정 (이슈 #322).
# 1차 출처는 iTunes Search API (key 불필요, 즉시 호출 가능).
# - base-url: iTunes Search API 엔드포인트. 운영/테스트에서 override 가능
#             (테스트는 MockWebServer/WireMock 같은 stub 으로 교체).
# - country: 검색 country code — 한국 가요 매칭 정확도 위해 KR 기본.
# - request-timeout: 곡당 호출 timeout. iTunes 응답은 보통 < 500ms 지만 안전 마진.
# - throttle: 곡 사이 sleep — Apple 공식 rate limit 명시 없으나 1초 1 req 보수적 보호.
# - thumb-resolution: artworkUrl100 의 `100x100` 을 치환할 해상도 (기본 600x600).
album-cover:
  itunes:
    base-url: ${ITUNES_SEARCH_BASE_URL:https://itunes.apple.com/search}
    country: ${ITUNES_SEARCH_COUNTRY:KR}
    request-timeout: 5s
    throttle: 1s
    thumb-resolution: 600x600

# Python audio analysis tool (tools/audio-analysis/analyze.py) 호출 설정.
# spec: docs/features/audio-tooling-bootstrap.md §3
# - python-cmd: 실행 명령. 로컬 venv 사용 시 절대경로 또는 환경변수로 override.
# - tool-dir:  analyze.py 가 위치한 디렉터리. 운영/컨테이너에서는 마운트 경로로 override.
# - timeout:   외부 process 최대 대기 시간. 곡당 분석 목표 30s + 마진.
audio:
  analysis:
    python-cmd: ${AUDIO_ANALYSIS_PYTHON_CMD:python3}
    tool-dir: ${AUDIO_ANALYSIS_TOOL_DIR:../tools/audio-analysis}
    timeout: 60s
    # use-docker=true 시 호스트 Python 대신 docker compose 컨테이너에서 실행 (spec PR D).
    # 기본 false — 호스트 Python 사용 (CI/로컬 venv).
    use-docker: ${AUDIO_ANALYSIS_USE_DOCKER:false}
    docker-compose-file: ${AUDIO_ANALYSIS_COMPOSE_FILE:../docker-compose.audio.yml}
    docker-compose-service: ${AUDIO_ANALYSIS_COMPOSE_SERVICE:audio-analysis}
