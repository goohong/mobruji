plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '3.5.12'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.mobruji'
version = '0.0.1-SNAPSHOT'
description = 'mobruji karaoke recommendation backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.rest-assured:rest-assured:5.5.0'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

checkstyle {
	toolVersion = '10.17.0'
	configFile = file('config/checkstyle/checkstyle.xml')
	maxWarnings = 0
}

checkstyleTest {
	enabled = false
}

spotless {
	java {
		target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
		eclipse('4.30').configFile('config/formatter/eclipse-java-mobruji-style.xml')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// (#1453) 소형 NCP VM(2vCPU/3.9GB, swap 1GB) 에서 be sub-agent 가 test 를 돌릴 때
	// 병렬 fork × 무제한 heap 이 swap thrash(load 29, ssh hang)를 유발했다. test fork 를
	// 단일·heap 상한으로 묶어 피크 메모리를 경계한다. CI(여유 RAM)에서도 안전·결정적.
	maxParallelForks = 1
	maxHeapSize = '512m'
}
