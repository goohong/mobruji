name: Audio Analysis CI Trend - mobruji

# audio-analysis CI 빌드 시간 추세 집계 + 대안 라이브러리 평가 트리거.
#
# 배경:
#   librosa-ci-build-monitoring spec (docs/features/librosa-ci-build-monitoring.md)
#   의 PR 3 항목. audio-analysis-ci.yml (PR 2) 이 PR 마다 누적하는
#   `audio-analysis-ci-timing-<run_id>` artifact (timing.json) 를 매일 1회
#   30일 retention 범위에서 모두 조회해 total_seconds 시계열 + p95 를 계산한다.
#
# 트리거 (spec §8 Q3 = (a) cron 매일 1회):
#   - schedule: 매일 UTC 00:00 (KST 09:00).
#   - workflow_dispatch: 수동 점검.
#
# 동작:
#   - 30일 내 `audio-analysis-ci-timing-*` artifact 모두 download → timing.json 파싱.
#   - PR 별 최신 1건으로 dedupe → total_seconds 시계열 + p95/avg/max 계산.
#   - 최근 3개 PR 이 모두 임계 초과 (spec §5-3 규칙 2 / §5-7 조건 A) →
#     자동 이슈 등록 (title: infra-audio-analysis-library-eval).
#     동일 제목 OPEN 이슈 존재 시 중복 등록 skip.
#   - trend.json 을 `trend-summary` artifact 로 upload (spec §5-6 조회 가이드).
#
# 설정:
#   - vars.MOBRUJI_AUDIO_CI_TOTAL_THRESHOLD_SEC (default 300, spec §5-4).
#
# 안전망:
#   - artifact 0건이면 trend.json count=0 으로 기록 후 issue 로직 skip (graceful).
#   - 본 workflow 는 `.github/workflows/**` 정보성 보호 영역 — rev sub-agent
#     review 대행 (2026-05-28, needs-human-review 라벨 폐지).
#
# 관련:
#   - 자매 workflow: audio-analysis-ci.yml (PR 2, timing artifact 생산자)
#   - spec: docs/features/librosa-ci-build-monitoring.md §5-3 §5-6 §5-7

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 UTC 00:00 (KST 09:00)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run 모드 (이슈 등록 안 함, 추세만 집계)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: ci-audio-analysis-trend
  cancel-in-progress: true

jobs:
  trend:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      THRESHOLD: ${{ vars.MOBRUJI_AUDIO_CI_TOTAL_THRESHOLD_SEC || '300' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - name: Collect timing artifacts (last 30 days)
        id: collect
        run: |
          set -euo pipefail
          mkdir -p _artifacts _work
          SINCE=$(date -u -d '30 days ago' +%s)

          # 30일 내 + 미만료 audio-analysis-ci-timing-* artifact 목록.
          gh api --paginate "/repos/${REPO}/actions/artifacts?per_page=100" \
            --jq '.artifacts[]
              | select(.name | startswith("audio-analysis-ci-timing-"))
              | select(.expired == false)
              | {id, name, created_at}' > _work/artifacts.ndjson || true

          : > _work/records.ndjson
          if [ -s _work/artifacts.ndjson ]; then
            while IFS= read -r line; do
              ID=$(echo "$line" | jq -r '.id')
              CREATED=$(echo "$line" | jq -r '.created_at')
              CREATED_TS=$(date -u -d "$CREATED" +%s)
              if [ "$CREATED_TS" -lt "$SINCE" ]; then
                continue
              fi
              # artifact zip download → timing.json 추출.
              if gh api "/repos/${REPO}/actions/artifacts/${ID}/zip" > "_artifacts/${ID}.zip" 2>/dev/null; then
                rm -rf "_work/unzip_${ID}"
                if unzip -o -q "_artifacts/${ID}.zip" -d "_work/unzip_${ID}" 2>/dev/null; then
                  TJ=$(find "_work/unzip_${ID}" -name 'timing.json' -type f | head -1)
                  if [ -n "$TJ" ] && jq -e . "$TJ" >/dev/null 2>&1; then
                    jq -c '{
                      pr_number: (.pr_number // ""),
                      commit_sha: (.commit_sha // ""),
                      total_seconds: (.total_seconds // 0),
                      recorded_at: (.recorded_at // "")
                    }' "$TJ" >> _work/records.ndjson
                  fi
                fi
              fi
            done < _work/artifacts.ndjson
          fi

          COUNT=$(wc -l < _work/records.ndjson | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "수집된 timing record: $COUNT 건 (임계치 ${THRESHOLD}s)"

      - name: Compute trend (p95 + consecutive breach)
        id: trend
        run: |
          set -euo pipefail
          THRESHOLD_NUM=${THRESHOLD}

          jq -s \
            --argjson threshold "$THRESHOLD_NUM" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            # PR 별 최신 1건으로 dedupe (재push 시 마지막 timing 사용).
            (group_by(.pr_number)
              | map(sort_by(.recorded_at) | last)) as $dedup
            # 최신순 정렬 (recorded_at desc).
            | ($dedup | sort_by(.recorded_at) | reverse) as $byrecent
            | ([ $dedup[].total_seconds ] | sort) as $sorted
            | ($sorted | length) as $n
            | (if $n == 0 then 0
               else $sorted[ (((($n) * 0.95) | ceil) - 1) | (if . < 0 then 0 elif . >= $n then $n - 1 else . end) ]
               end) as $p95
            | (if $n == 0 then 0 else ($sorted | add / $n | floor) end) as $avg
            | (if $n == 0 then 0 else ($sorted | last) end) as $max
            # 최근 3개 PR 모두 임계 초과 여부.
            | ($byrecent[0:3]) as $last3
            | (($last3 | length) >= 3
               and ([ $last3[] | select(.total_seconds > $threshold) ] | length) == 3) as $breach
            | {
                generated_at: $generated_at,
                threshold_seconds: $threshold,
                count: $n,
                total_seconds_p95: $p95,
                total_seconds_avg: $avg,
                total_seconds_max: $max,
                consecutive_breach: $breach,
                last3_prs: $last3,
                series: ($byrecent | map({pr_number, commit_sha, total_seconds, recorded_at}))
              }
          ' _work/records.ndjson > trend.json

          cat trend.json
          BREACH=$(jq -r '.consecutive_breach' trend.json)
          echo "breach=$BREACH" >> "$GITHUB_OUTPUT"

      - name: Upload trend summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: trend-summary
          path: trend.json
          retention-days: 30

      - name: Open library-eval issue on consecutive breach
        if: steps.trend.outputs.breach == 'true' && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          TITLE="infra-audio-analysis-library-eval"

          # 동일 제목 OPEN 이슈 존재 시 중복 등록 skip.
          EXISTING=$(gh issue list --repo "$REPO" --state open \
            --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "이미 OPEN 이슈 존재 (\"$TITLE\") — 중복 등록 skip"
            exit 0
          fi

          P95=$(jq -r '.total_seconds_p95' trend.json)
          MAXV=$(jq -r '.total_seconds_max' trend.json)
          LAST3=$(jq -r '.last3_prs | map("- PR #\(.pr_number): \(.total_seconds)s (\(.recorded_at))") | join("\n")' trend.json)

          {
            echo "## Context"
            echo ""
            echo "audio-analysis CI total_seconds 가 **최근 3개 PR 연속 임계치(${THRESHOLD}s) 초과** — librosa-ci-build-monitoring spec §5-3 규칙 2 / §5-7 조건 A 충족."
            echo ""
            echo "이 이슈는 \`audio-analysis-ci-trend.yml\` 워크플로우가 자동 등록했습니다 (대안 라이브러리 평가 ADR \`0020-audio-analysis-library-alternatives\` 의 input)."
            echo ""
            echo "## 추세 요약"
            echo ""
            echo "- 임계치: ${THRESHOLD}s"
            echo "- total_seconds p95: ${P95}s"
            echo "- total_seconds max: ${MAXV}s"
            echo ""
            echo "최근 3개 PR:"
            echo "${LAST3}"
            echo ""
            echo "## TO-BE"
            echo ""
            echo "- spec §5-7 대안 후보 (essentia / aubio / torchaudio) 비교 차원으로 별도 ADR \`docs/decisions/0020-audio-analysis-library-alternatives.md\` 신설 검토."
            echo "- trend-summary artifact (\`gh run download --name trend-summary\`) 로 시계열 확인."
            echo ""
            echo "> 자동 생성 — librosa-ci-build-monitoring PR 3 (#292)"
          } > _work/issue_body.md

          gh issue create --repo "$REPO" \
            --title "$TITLE" \
            --body-file _work/issue_body.md \
            --label task --label type:chore --label scope:infra --label ai-generated
          echo "이슈 등록 완료: $TITLE"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Audio Analysis CI Trend"
            echo ""
            echo "- 수집 record: ${{ steps.collect.outputs.count }} 건"
            echo "- 임계치: ${THRESHOLD}s"
            echo "- consecutive breach: ${{ steps.trend.outputs.breach }}"
            echo "- dry-run: ${DRY_RUN}"
          } >> "$GITHUB_STEP_SUMMARY"
