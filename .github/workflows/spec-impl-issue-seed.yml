name: Feature Spec Impl Issue Auto-Seed

# 끊긴 고리 잇기 (#1595): Feature Spec(`docs/features/<slug>.md`) 머지 → 그 §6
# "작업 분할 (예상 PR 리스트)" 의 미완료 항목을 구현 이슈로 자동 등록.
#
# 왜:
#   autoseed(`tools/agent/autoseed.py`)는 GitHub open 이슈(scope 라벨)를 cycle 큐로
#   자동 시드한다. 즉 **구현 이슈가 GitHub 에 있으면** be/fe/plan cycle 로 자동 흐른다.
#   그러나 plan 이 spec 을 머지해도 §6 작업분할의 구현 이슈가 자동 생성되지 않아
#   사람이 수동 등록해야 했다 → "spec 세우면 작업으로 이어진다" 가 자동이 아니었다.
#   본 워크플로우가 spec 머지와 구현 이슈 등록 사이의 수동 의존을 제거한다.
#
# 설계 (신뢰성 > 똑똑함):
#   1) §6 의 markdown 체크리스트 `- [ ] ...` **미체크 항목** 을 1차 파싱해 항목당
#      구현 이슈를 등록한다. 항목의 `(be)` `(fe)` `(infra)` `(plan)` 주석 또는
#      spec frontmatter 의 `scope:` 로 라벨을 추정한다.
#   2) 파싱이 0건이면 (§6 형식이 표/산문 등 비정형) **단일 tracking 이슈** 1건만
#      등록해 nmae/사람이 작업분할을 이어받게 한다. 어느 경로든 수동 의존 0.
#
# 멱등 (필수):
#   생성 이슈 body 에 marker `<!-- autospec:<slug>#<n> -->` 삽입. <n> 은 항목 텍스트
#   기반 안정 해시(체크리스트) 또는 `tracking`. 재머지/spec 수정 시 동일 marker 를
#   GitHub 검색해 존재하면 skip → 중복 이슈 없음.
#
# gate:
#   - status 가 `approved` 또는 `implementing` 인 spec 만 시드 (draft/blocked/
#     deprecated/shipped 는 skip — 미합의/차단/완료 상태에서 구현 이슈 양산 방지).
#   - 이미 체크된 `- [x]` 항목은 skip (구현 완료 표기).
#
# 충돌 없음:
#   - spec-status-check.yml: pull_request opened/synchronize 시 frontmatter 검증 (read).
#   - rev-findings-register.yml: labeled 트리거. 본 워크플로우는 closed(merged) 트리거.
#   세 워크플로우 트리거/대상이 겹치지 않는다.
#
# 관련: 이슈 #1595, autoseed spec docs/features/roadmap-queue-autoseed.md,
#       docs/ai-harness/02-agent-workflow.md §9-4 (Feature Spec 프로세스).

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  seed:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const { execSync } = require('child_process');

            const pr = context.payload.pull_request;
            const prNum = pr.number;
            const { owner, repo } = context.repo;

            const VALID_SCOPES = ['user', 'song', 'recommendation', 'voice', 'infra', 'web', 'feedback'];
            const VALID_TYPES = ['feat', 'fix', 'docs', 'style', 'refactor', 'test', 'chore'];
            const SEED_STATUSES = ['approved', 'implementing'];
            const dir = 'docs/features';
            const EXCLUDE = new Set(['README.md', '_template.md']);

            // (be) / (fe) / (infra) / (plan) cycle 주석 → scope 추정 매핑.
            // be/plan 은 대표 도메인이 미정이라 frontmatter scope 를 우선 사용한다.
            const CYCLE_TO_SCOPE = { fe: 'web', infra: 'infra' };

            // --- 1) 본 PR 에서 변경된 spec 파일 목록 추출 ---------------------------
            const baseSha = pr.base.sha;
            const headSha = pr.merge_commit_sha || pr.head.sha;
            let changedSpecs = [];
            try {
              const out = execSync(
                `git diff --name-only ${baseSha} ${headSha} -- 'docs/features/*.md'`,
                { encoding: 'utf8' }
              );
              changedSpecs = out.split('\n')
                .map(s => s.trim())
                .filter(s => s.length > 0)
                .filter(p => !EXCLUDE.has(path.basename(p)));
            } catch (e) {
              core.warning(`git diff 실패 — changed spec 탐지 skip: ${e.message}`);
            }
            if (changedSpecs.length === 0) {
              core.info('변경된 Feature Spec 없음 — 시드할 구현 이슈 없음 (graceful).');
              return;
            }

            // 안정 해시: 항목 텍스트 정규화 후 8자 hex.
            const itemHash = (s) =>
              crypto.createHash('sha1')
                .update(s.replace(/\s+/g, ' ').trim().toLowerCase())
                .digest('hex').slice(0, 8);

            // marker 존재 시 skip (멱등). GitHub 검색은 open+closed 모두 포함.
            async function alreadySeeded(marker) {
              try {
                const res = await github.rest.search.issuesAndPullRequests({
                  q: `repo:${owner}/${repo} in:body "${marker}"`, per_page: 1,
                });
                return res.data.total_count > 0;
              } catch (e) {
                // 검색 실패 시 안전하게 "이미 있음" 으로 간주 — 중복 생성보다 누락이 안전.
                core.warning(`marker 검색 실패 (${marker}) — 보수적으로 skip: ${e.message}`);
                return true;
              }
            }

            let totalCreated = 0, totalSkipped = 0, totalTracking = 0;

            for (const specPath of changedSpecs) {
              if (!fs.existsSync(specPath)) {
                core.info(`삭제된 spec skip: ${specPath}`);
                continue;
              }
              const slug = path.basename(specPath, '.md');
              const content = fs.readFileSync(specPath, 'utf8');

              // --- frontmatter: status + scope -----------------------------------
              const fmMatch = content.match(/^---\n([\s\S]*?)\n---/);
              const fm = fmMatch ? fmMatch[1] : '';
              const statusMatch = fm.match(/^status:\s*(\S+)/m);
              const status = statusMatch ? statusMatch[1] : null;
              if (!SEED_STATUSES.includes(status)) {
                core.info(`${slug}: status=${status || 'none'} — 시드 대상 아님 (approved/implementing 만). skip.`);
                continue;
              }
              const scopeMatch = fm.match(/^scope:\s*(\S+)/m);
              const fmScope = scopeMatch && VALID_SCOPES.includes(scopeMatch[1]) ? scopeMatch[1] : 'infra';

              // --- §6 본문 추출 ("## 6) ..." ~ 다음 "## " 직전) -------------------
              const lines = content.split('\n');
              let s6Start = -1, s6End = lines.length;
              for (let i = 0; i < lines.length; i++) {
                if (/^##\s*6\)/.test(lines[i])) { s6Start = i; break; }
              }
              if (s6Start === -1) {
                core.info(`${slug}: §6 작업 분할 섹션 없음 — skip.`);
                continue;
              }
              for (let i = s6Start + 1; i < lines.length; i++) {
                if (/^##\s+/.test(lines[i])) { s6End = i; break; }
              }
              const s6 = lines.slice(s6Start, s6End);

              // --- 미체크 체크리스트 항목 파싱 ------------------------------------
              // `- [ ] ...` 만 (대문자 X / 소문자 x 체크 제외). 멀티라인 항목은 첫 줄만.
              const items = [];
              for (const line of s6) {
                const m = line.match(/^\s*[-*]\s+\[\s\]\s+(.+?)\s*$/);
                if (m) items.push(m[1].trim());
              }

              if (items.length === 0) {
                // --- fallback: tracking 이슈 1건 (§6 형식 비정형 / 미체크 항목 0) ---
                const marker = `<!-- autospec:${slug}#tracking -->`;
                if (await alreadySeeded(marker)) {
                  core.info(`${slug}: tracking 이슈 이미 등록됨 — skip.`);
                  totalSkipped++;
                  continue;
                }
                const body = [
                  `Feature Spec \`${slug}\` (status=${status}) 가 머지됐으나 §6 작업 분할에서`,
                  `자동 파싱 가능한 미체크 체크리스트 항목을 찾지 못했습니다 (표/산문 형식이거나 모두 완료).`,
                  '',
                  `**해야 할 일**: \`docs/features/${slug}.md\` §6 을 확인해 남은 구현 작업을`,
                  `개별 이슈로 분할하거나, §6 를 \`- [ ] (scope) 설명\` 체크리스트 형식으로 보강하면`,
                  `다음 spec 갱신 머지 시 이 워크플로우가 항목별 이슈를 자동 등록합니다.`,
                  '',
                  `참고: docs/features/${slug}.md`,
                  `원본 spec 머지 PR: #${prNum}`,
                  marker,
                ].join('\n');
                try {
                  const issue = await github.rest.issues.create({
                    owner, repo,
                    title: `[spec] ${slug} 구현 작업 분할 (tracking)`,
                    body,
                    labels: ['ai-generated', `scope:${fmScope}`, 'type:docs'],
                  });
                  core.info(`tracking 이슈 등록: #${issue.data.number} (${slug})`);
                  totalTracking++;
                } catch (e) {
                  core.warning(`tracking 이슈 생성 실패 (${slug}): ${e.message}`);
                }
                continue;
              }

              // --- 항목별 구현 이슈 등록 ------------------------------------------
              for (const raw of items) {
                const marker = `<!-- autospec:${slug}#${itemHash(raw)} -->`;
                if (await alreadySeeded(marker)) {
                  core.info(`${slug}: 항목 이미 등록됨 — skip ("${raw.slice(0, 50)}").`);
                  totalSkipped++;
                  continue;
                }

                // scope 추정: 항목의 (be)/(fe)/(infra)/(plan) 주석 → CYCLE_TO_SCOPE,
                // 없으면 frontmatter scope. be/plan 주석은 도메인 미정이라 frontmatter 우선.
                let itemScope = fmScope;
                const cycleAnno = raw.match(/\((be|fe|infra|plan)(?:[,)\s])/i);
                if (cycleAnno) {
                  const cyc = cycleAnno[1].toLowerCase();
                  if (CYCLE_TO_SCOPE[cyc]) itemScope = CYCLE_TO_SCOPE[cyc];
                }
                // 항목에 명시 scope:xxx 주석이 있으면 그것 우선.
                const explicitScope = raw.match(/scope:(\w+)/);
                if (explicitScope && VALID_SCOPES.includes(explicitScope[1])) {
                  itemScope = explicitScope[1];
                }

                // type 추정: 항목 텍스트 휴리스틱 (default feat — spec 구현은 신규가 다수).
                let itemType = 'feat';
                const lowered = raw.toLowerCase();
                if (/\b(fix|버그|수정)\b/.test(lowered)) itemType = 'fix';
                else if (/\b(test|테스트)\b/.test(lowered)) itemType = 'test';
                else if (/\b(refactor|리팩터)/.test(lowered)) itemType = 'refactor';
                else if (/\b(docs|문서)\b/.test(lowered)) itemType = 'docs';

                // 제목: 마크다운 강조/PR 라벨 잡음 제거 후 80자 절단.
                const cleanTitle = raw
                  .replace(/\*\*/g, '')
                  .replace(/^PR\s*\d+\s*\([^)]*\)\s*:?\s*/i, '')
                  .replace(/\s*\(#\d+[^)]*\)\s*$/, '')
                  .trim()
                  .slice(0, 80);

                const body = [
                  `Feature Spec \`${slug}\` §6 작업 분할 항목 자동 등록 (#1595 spec→impl 고리).`,
                  '',
                  `**작업**: ${raw}`,
                  '',
                  `참고: docs/features/${slug}.md`,
                  `원본 spec 머지 PR: #${prNum}`,
                  `구현 PR 머지 시 spec §6 의 해당 항목을 \`- [x]\` 로 체크하세요.`,
                  marker,
                ].join('\n');

                try {
                  const issue = await github.rest.issues.create({
                    owner, repo,
                    title: `[${slug}] ${cleanTitle}`,
                    body,
                    labels: ['ai-generated', `scope:${itemScope}`, `type:${itemType}`],
                  });
                  core.info(`구현 이슈 등록: #${issue.data.number} scope=${itemScope} type=${itemType} ("${cleanTitle}").`);
                  totalCreated++;
                } catch (e) {
                  core.warning(`구현 이슈 생성 실패 ("${cleanTitle}"): ${e.message}`);
                }
              }
            }

            core.notice(
              `Spec→impl 시드 완료 (PR #${prNum}): ` +
              `구현 이슈 ${totalCreated}건 / tracking ${totalTracking}건 / skip ${totalSkipped}건.`
            );
