name: Auto Label PR

# PR 제목 `type(scope):` prefix에서 type:* / scope:* 라벨 자동 부여.
# 커밋 trailer에서 Co-Authored-By: Claude / OpenAI Codex 감지해 ai:* 라벨 추가.
# 보호 영역 파일 변경 시 needs-human-review 라벨 추가.
#
# 보호 영역 라벨 가드 (#124):
# - 트리거에 reopened / ready_for_review / unlabeled 추가 — draft → ready, 라벨 수동 제거 시에도 재평가.
# - 보호 영역 파일이 변경된 PR에서 needs-human-review가 부착되지 않은 채 종료되면 워크플로우 실패 처리(체크 fail).
#   → 라벨 제거 후 머지 시도 시 가시화.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, unlabeled]

permissions:
  pull-requests: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title;

            const labels = new Set();

            // 1) 릴리즈 PR (`release: vX.Y.Z` 또는 `release: YYYY-MM-DD`) — scope 없음.
            //    별도 분기로 처리하고 type:release 라벨만 부여한다.
            if (/^release:/i.test(title)) {
              labels.add('type:release');
            } else {
              // 2) 일반 PR — `type(scope): 제목` 패턴.
              const m = title.match(/^(\w+)\(([\w-]+)\):/);
              if (!m) {
                core.warning(`PR title "${title}" does not match "type(scope): ..." or "release: ..." pattern`);
              } else {
                const [, type, scope] = m;
                const allowedTypes = ['feat','fix','docs','style','refactor','test','chore'];
                const allowedScopes = ['feedback','infra','recommendation','song','user','voice','web'];
                if (allowedTypes.includes(type)) labels.add(`type:${type}`);
                else core.warning(`Unknown type: ${type}`);
                if (allowedScopes.includes(scope)) labels.add(`scope:${scope}`);
                else core.warning(`Unknown scope: ${scope}`);
              }
            }

            // Detect AI authorship from commit messages
            const commits = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const allMessages = commits.data.map(c => c.commit.message).join('\n');
            const hasClaude = /Co-Authored-By:\s*Claude/i.test(allMessages);
            const hasCodex = /Co-Authored-By:\s*OpenAI Codex/i.test(allMessages);
            if (hasClaude || hasCodex) labels.add('ai-generated');
            if (hasClaude) labels.add('ai:claude');
            if (hasCodex) labels.add('ai:codex');

            // Protected area detection
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const protectedPatterns = [
              /^\.github\/workflows\//,
              /^\.github\/CODEOWNERS$/,
              /\/db\/migration\//,
              /\/resources\/db\//,
              /(^|\/)application[^/]*\.ya?ml$/,
              /(^|\/)application[^/]*\.properties$/,
              /(^|\/)\.env/,
              /^backend\/build\.gradle/,
              /^backend\/settings\.gradle/,
              /^backend\/gradle\//,
              /^web\/next\.config\./,
              /^web\/package\.json$/,
              // lockfile은 lockfile-only 변경(devDep 추가 등)도 보호 영역 — 이슈 #124 기준.
              /^web\/package-lock\.json$/,
              /^web\/pnpm-lock\.ya?ml$/,
              /^web\/yarn\.lock$/,
              /^web\/.*-lock\./,
              /^Dockerfile$/,
              /^docker-compose.*\.ya?ml$/,
              /^LICENSE$/,
            ];
            const protectedHits = files.data.filter(f =>
              protectedPatterns.some(p => p.test(f.filename))
            );
            const hasProtected = protectedHits.length > 0;
            if (hasProtected) {
              labels.add('needs-human-review');
              core.notice(
                `Protected paths detected (${protectedHits.length}): ` +
                  protectedHits.map(h => h.filename).slice(0, 10).join(', ')
              );
            }

            // Session label inference (#1002 — fallback for sub-agent missed cases).
            //
            // 우선순위:
            //   1. sub-agent 가 PR 생성 시 직접 박은 session:* 라벨 → 그대로 유지 (auto-label은 추가 안 함)
            //   2. 파일 경로 기반 추론 fallback (아래)
            //
            // sub-agent 명시 부착이 default — 이 fallback 은 누락 안전망. 상세:
            //   docs/ai-harness/actors/sub-agent.md §1 PR session 라벨 부착 의무.
            //
            // 사용자 정정 (2026-05-24, 이슈 #1002):
            //   "각 PR이 무슨 agent가 작업했는지 라벨 제대로 안 붙어있어?"
            //   머지 43 PR 중 7건 (16%) 만 session 라벨 — 36건 누락.
            //
            // 분류 룰 (위에서 아래로, 첫 매칭에서 종료):
            //   - PR 에 이미 session:* 라벨 있음 → skip (sub-agent 명시 부착 우선)
            //   - 파일 전부 backend/** → session:backend
            //   - 파일 전부 web/** → session:frontend
            //   - 파일이 tools/** 포함 (helper sub-agent 가 다루는 영역) → session:helper
            //   - 파일이 docs/** / CLAUDE.md / *.md 만 (코드 변경 없음) → session:plan
            //   - 파일이 .github/** / scripts/** 만 (인프라 only) → session:plan
            //   - 그 외 혼합 → 라벨 없음 (사람 판단)
            const existingSessionLabel = [...labels].some(l => l.startsWith('session:'))
              || (pr.labels || []).some(l => {
                  const name = typeof l === 'string' ? l : l.name;
                  return name && name.startsWith('session:');
                });
            const fileNames = files.data.map(f => f.filename);
            if (!existingSessionLabel && fileNames.length > 0) {
              const allBackend = fileNames.every(f => f.startsWith('backend/'));
              const allWeb = fileNames.every(f => f.startsWith('web/'));
              const hasTools = fileNames.some(f => f.startsWith('tools/'));
              const isDocsOnly = fileNames.every(f =>
                f.startsWith('docs/')
                || f === 'CLAUDE.md'
                || f === 'AGENTS.md'
                || f === 'README.md'
                || f.endsWith('.md')
              );
              const isInfraOnly = fileNames.every(f =>
                f.startsWith('.github/')
                || f.startsWith('scripts/')
              );
              if (allBackend) {
                labels.add('session:backend');
                core.notice('session inferred: backend (files all under backend/)');
              } else if (allWeb) {
                labels.add('session:frontend');
                core.notice('session inferred: frontend (files all under web/)');
              } else if (hasTools) {
                // tools/ 는 helper / nmae 가 관리. helper sub-agent 가 가장 흔히 건드림.
                labels.add('session:helper');
                core.notice('session inferred: helper (files include tools/)');
              } else if (isDocsOnly) {
                labels.add('session:plan');
                core.notice('session inferred: plan (docs-only)');
              } else if (isInfraOnly) {
                labels.add('session:plan');
                core.notice('session inferred: plan (infra-only — .github/ or scripts/)');
              } else {
                core.notice('session not inferred (mixed file paths) — sub-agent should add session:* explicitly');
              }
            }

            const toAdd = [...labels];
            if (toAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: toAdd,
              });
              core.notice(`Applied labels: ${toAdd.join(', ')}`);
            } else {
              core.notice('No labels to apply');
            }

            // 보호 영역 가드 (#124): addLabels 호출 후 실제 PR 상태를 다시 조회하여
            // needs-human-review가 부착됐는지 확인. 누군가 직전에 라벨을 제거한 unlabeled 이벤트라면
            // 위에서 다시 부착되지만, GitHub API 전파 지연으로 누락될 가능성을 닫기 위해
            // 보호 영역 변경이 감지된 PR에서 needs-human-review가 없으면 워크플로우를 실패 처리한다.
            if (hasProtected) {
              const fresh = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              });
              const names = fresh.data.labels.map(l => (typeof l === 'string' ? l : l.name));
              if (!names.includes('needs-human-review')) {
                core.setFailed(
                  'Protected paths changed but `needs-human-review` label is missing. ' +
                    'Re-run this workflow or add the label manually before merging.'
                );
              }
            }
