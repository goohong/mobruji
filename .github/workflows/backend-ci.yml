name: Backend CI - mobruji

on:
  pull_request:
    branches: [ "develop", "main" ]
    types: [ opened, synchronize, reopened ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mobruji_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'gradle'
          cache-dependency-path: backend/*.gradle*

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Code Style And Format
        run: ./gradlew checkstyleMain spotlessCheck

      - name: Test with Gradle
        run: ./gradlew test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/mobruji_test?useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root

      - name: BootJar with Gradle
        run: ./gradlew bootJar -x test

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: 'backend/build/test-results/test/TEST-*.xml'

      - name: Comment failed code lines
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'backend/build/test-results/test/TEST-*.xml'
          token: ${{ github.token }}
