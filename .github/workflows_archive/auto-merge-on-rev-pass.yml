name: Auto-merge on Rev Pass

# rev sub-agent 가 단계 1 통과 (라벨 `reviewed:claude` 부착) + CI green + 보호 영역
# 라벨 없음 + mergeable 상태인 PR 을 자동 squash merge.
#
# 배경 (2026-05-26 사용자 정정):
#   "관리가 안되면 머지 후에 rev 가 리뷰하지도 않을 거 같은데 forum 을 잘 활용해서
#    각 agent 가 자기 계획이 있어야지. 백로그 보면서 작업 안 까먹고 다 진행하고."
#   현재 OPEN PR 12건 중 #1079 #1083 (rev pass + MERGEABLE) 가 머지 안 됨 = 방치.
#   LLM 자율 / 학습 의존 = 굴복 패턴. 봇/스크립트 강제 (= 헌법) 가 정답.
#
# 트리거:
#   - pull_request: labeled / unlabeled / synchronize / ready_for_review / opened /
#     reopened — 라벨 부착 직후 즉시 평가.
#   - check_suite: completed — CI green 완료 시 재평가 (라벨은 있는데 CI 가
#     늦게 끝난 케이스).
#   - schedule: 매 5분 — 라벨/CI 모두 OK 인데 mergeable 이 UNKNOWN 으로 떴다가
#     늦게 MERGEABLE 로 전이되는 케이스 cover.
#   - workflow_dispatch: dry-run 검증.
#
# 조건 (모두 AND):
#   - 라벨 `reviewed:claude` 포함
#   - 라벨 `rev:hold` 없음 (rev audit HOLD — author rebase 대기)
#   - 라벨 `scope:release` 없음 (release PR — 사용자 수동 머지)
#   - 라벨 `do-not-merge` 없음 (escape hatch)
#
# 2026-05-28: `needs-human-review` 차단 라벨 폐지 — rev sub-agent 가 review 대행.
#   - PR.draft == false
#   - PR.mergeable == "MERGEABLE" (GraphQL 응답)
#   - PR base == develop (release PR 머지 사고 방지 — develop 만 대상)
#
# 동작:
#   - 위 조건 충족 시 `gh pr merge --squash --delete-branch --auto` 호출.
#   - 실패 시 PR 코멘트로 사유 남김 (사용자 가시).
#
# 안전망:
#   - workflow_dispatch 로 dry-run 가능 — input `dry_run=true` 시 머지 호출
#     skip + 후보 list 만 print.
#   - 본 workflow 자체는 `.github/workflows/**` 정보성 보호 영역 — rev sub-agent 가
#     review 대행 (2026-05-28 정책 변경, `needs-human-review` 라벨 폐지).
#
# 관련:
#   - 메모리 [[feedback-rev-e2e-always]] [[feedback-rev-release-gate]]
#   - docs/features/rev-e2e-3-stages.md
#   - 사용자 정정 (2026-05-26 12:24 KST)

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize, ready_for_review]
    branches: [develop]
  check_suite:
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run 모드 (실제 머지 안 함, 후보만 print)'
        type: boolean
        default: true

permissions:
  pull-requests: write
  contents: write
  checks: read
  issues: write

jobs:
  auto-merge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        with:
          # GH_TOKEN 으로 squash merge 호출. GITHUB_TOKEN 은 default scope 로
          # contents:write + pull-requests:write 필요 (위 permissions block 참고).
          script: |
            const dryRun = process.env.DRY_RUN === 'true';
            core.info(`Auto-merge run — dryRun=${dryRun}, trigger=${context.eventName}`);

            // PR 후보 수집 — trigger 별 분기.
            //   pull_request 트리거: payload 의 단일 PR 만 평가.
            //   check_suite / schedule / workflow_dispatch: open PR 전체 평가.
            let candidates = [];
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              if (pr) candidates.push(pr.number);
            } else {
              // open PR 전체 list — develop base 만.
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                base: 'develop',
                per_page: 50,
              });
              candidates = prs.map(p => p.number);
            }

            core.info(`Candidate PRs: ${candidates.join(', ') || '(none)'}`);

            // 차단 라벨 — 하나라도 있으면 자동 머지 skip.
            // 2026-05-28: `needs-human-review` 제거 (rev sub-agent 가 review 대행).
            const blockLabels = [
              'rev:hold',
              'scope:release',
              'do-not-merge',
            ];

            const merged = [];
            const skipped = [];

            for (const num of candidates) {
              // GraphQL 로 mergeable + labels + draft + reviewDecision + mergeStateStatus 한 번에.
              // pulls.get REST 의 mergeable 은 boolean 인데 GraphQL 의 mergeable enum 이
              // 더 명시적 (MERGEABLE / CONFLICTING / UNKNOWN).
              const q = `
                query($owner:String!,$repo:String!,$num:Int!) {
                  repository(owner:$owner, name:$repo) {
                    pullRequest(number:$num) {
                      number title isDraft mergeable mergeStateStatus
                      baseRefName
                      labels(first:30){ nodes { name } }
                    }
                  }
                }
              `;
              // (#1509) GitHub 는 mergeable/mergeStateStatus 를 lazy 계산한다 — 다른 PR
              // 머지로 base(develop)가 움직인 직후 첫 조회는 UNKNOWN 을 돌려준다. 한 번만
              // 읽고 UNKNOWN 이면 skip 하면, base 가 자주 움직이는 자율 흐름에서 reviewed+
              // CLEAN 인 PR 이 영영 안 머지되는 간헐 실패가 난다(#1504/#1505). 조회 자체가
              // 계산을 trigger 하므로, UNKNOWN 이면 잠깐 대기 후 재조회(최대 5회)해 확정값을 받는다.
              let pr;
              try {
                for (let attempt = 0; attempt < 5; attempt++) {
                  const result = await github.graphql(q, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    num,
                  });
                  pr = result.repository.pullRequest;
                  if (!pr || (pr.mergeable !== 'UNKNOWN' && pr.mergeStateStatus !== 'UNKNOWN')) {
                    break;
                  }
                  core.info(`PR #${num}: mergeable/mergeStateStatus UNKNOWN — 재조회 ${attempt + 1}/5`);
                  await new Promise(res => setTimeout(res, 3000));
                }
              } catch (e) {
                core.warning(`PR #${num}: GraphQL 실패 — ${e.message}`);
                skipped.push(`#${num} graphql_error`);
                continue;
              }

              if (!pr) {
                skipped.push(`#${num} not_found`);
                continue;
              }

              const labels = pr.labels.nodes.map(l => l.name);
              const hasReviewedClaude = labels.includes('reviewed:claude');
              const hasBlock = blockLabels.find(b => labels.includes(b));

              if (pr.baseRefName !== 'develop') {
                skipped.push(`#${num} base=${pr.baseRefName}`);
                continue;
              }
              if (pr.isDraft) {
                skipped.push(`#${num} draft`);
                continue;
              }
              if (!hasReviewedClaude) {
                skipped.push(`#${num} no_reviewed_claude`);
                continue;
              }
              if (hasBlock) {
                skipped.push(`#${num} block:${hasBlock}`);
                continue;
              }
              if (pr.mergeable !== 'MERGEABLE') {
                skipped.push(`#${num} mergeable=${pr.mergeable}`);
                continue;
              }
              // mergeStateStatus: CLEAN = CI green + no conflict. UNSTABLE = CI 일부
              // 실패 (예: optional check) — 자동 머지 skip. BLOCKED = required check 미충족.
              // BEHIND = base 가 앞섬 (rebase 필요).
              // 안전 mode: CLEAN 만 허용 — UNSTABLE 도 차단 (사용자 검토 필요).
              if (pr.mergeStateStatus !== 'CLEAN') {
                skipped.push(`#${num} mergeStateStatus=${pr.mergeStateStatus}`);
                continue;
              }

              core.info(`PR #${num} ('${pr.title}') — 조건 충족, 머지 시도`);
              if (dryRun) {
                merged.push(`#${num} (dry-run)`);
                continue;
              }

              try {
                // mergePullRequest GraphQL — REST 의 pulls.merge 보다 안정적 (--auto 와 동등).
                // squash + delete branch 옵션.
                const mergeMutation = `
                  mutation($prId:ID!) {
                    mergePullRequest(input:{
                      pullRequestId:$prId,
                      mergeMethod:SQUASH
                    }) {
                      pullRequest { number merged }
                    }
                  }
                `;
                // pr.id 가 GraphQL ID — 다시 query.
                const idQ = await github.graphql(
                  `query($owner:String!,$repo:String!,$num:Int!) {
                     repository(owner:$owner,name:$repo) {
                       pullRequest(number:$num) { id headRefName }
                     }
                   }`,
                  { owner: context.repo.owner, repo: context.repo.repo, num }
                );
                const prId = idQ.repository.pullRequest.id;
                const headRef = idQ.repository.pullRequest.headRefName;
                const r = await github.graphql(mergeMutation, { prId });
                core.info(`PR #${num} merged: ${JSON.stringify(r.mergePullRequest.pullRequest)}`);

                // head branch 삭제 (별도 호출 — squash 시 GraphQL 이 자동 삭제 안 함).
                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `heads/${headRef}`,
                  });
                  core.info(`PR #${num} branch '${headRef}' deleted`);
                } catch (e) {
                  core.warning(`PR #${num} branch '${headRef}' 삭제 실패 (이미 삭제됐을 수 있음): ${e.message}`);
                }
                merged.push(`#${num}`);
              } catch (e) {
                core.warning(`PR #${num} 머지 실패: ${e.message}`);
                skipped.push(`#${num} merge_error:${e.message.slice(0, 80)}`);
                // PR 코멘트로 사유 남김 — 사용자 가시.
                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: num,
                    body: `🤖 auto-merge 시도 실패: ${e.message.slice(0, 200)}\n\nworkflow: ${context.workflow}, run: ${context.runId}`,
                  });
                } catch (commentErr) {
                  core.warning(`코멘트 추가 실패: ${commentErr.message}`);
                }
              }
            }

            core.notice(`Auto-merge result — merged: [${merged.join(', ') || 'none'}], skipped: [${skipped.join(', ') || 'none'}]`);
            // job summary 도 같이 — Actions UI 에서 가시.
            await core.summary
              .addHeading('Auto-merge on Rev Pass')
              .addRaw(`dryRun: \`${dryRun}\`\n\n`)
              .addRaw(`Merged: ${merged.length === 0 ? '_none_' : merged.join(', ')}\n\n`)
              .addRaw(`Skipped: ${skipped.length === 0 ? '_none_' : skipped.join(', ')}\n`)
              .write();
