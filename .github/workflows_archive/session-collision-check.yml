name: Session Collision Check

# 동시에 열린 PR들이 같은 파일을 만지면 경고 코멘트를 단다.
# 다중 세션(be/fe/rev) 운영에서 충돌 조기 감지 목적.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 현재 PR이 만지는 파일
            const myFilesResp = await github.rest.pulls.listFiles({
              owner, repo, pull_number: pr.number, per_page: 200,
            });
            const myFiles = new Set(myFilesResp.data.map(f => f.filename));

            // 다른 open non-draft PR들 조회
            const openPRs = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 100,
            });
            const collisions = [];
            for (const other of openPRs.data) {
              if (other.number === pr.number) continue;
              if (other.draft) continue;
              const otherFilesResp = await github.rest.pulls.listFiles({
                owner, repo, pull_number: other.number, per_page: 200,
              });
              const overlap = otherFilesResp.data
                .map(f => f.filename)
                .filter(f => myFiles.has(f));
              if (overlap.length > 0) {
                collisions.push({ number: other.number, title: other.title, overlap });
              }
            }

            if (collisions.length === 0) {
              core.notice('No file collisions with other open PRs');
              return;
            }

            const lines = ['⚠️ **Session Collision Check**: 다른 open PR과 겹치는 파일이 있습니다.', ''];
            for (const c of collisions) {
              lines.push(`- #${c.number} (${c.title}):`);
              for (const f of c.overlap.slice(0, 10)) {
                lines.push(`  - \`${f}\``);
              }
              if (c.overlap.length > 10) {
                lines.push(`  - ... +${c.overlap.length - 10} more`);
              }
            }
            lines.push('');
            lines.push('충돌 위험. 머지 순서 합의 후 진행하거나 후순위 PR이 rebase 필요.');

            const body = lines.join('\n');
            // 같은 PR에 중복 코멘트 방지: 기존 collision 코멘트 있으면 갱신
            const existing = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const marker = '⚠️ **Session Collision Check**';
            const prev = existing.data.find(c => c.body && c.body.startsWith(marker));
            if (prev) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: prev.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body,
              });
            }
            core.notice(`Reported ${collisions.length} collision(s)`);
