name: Auto Close Issues on Develop Merge

# GitHub은 default branch(main) 머지에서만 closes #N을 발동. develop 머지는 무시되므로 수동 처리.
# 이 워크플로우는 develop 머지 시 PR 본문의 closes/fixes/resolves 키워드를 파싱해 이슈를 닫는다.

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write
  pull-requests: read

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const regex = /\b(?:closes?d?|fix(?:es|ed)?|resolves?d?)\s+#(\d+)/gi;
            const issueNumbers = [...new Set(
              [...body.matchAll(regex)].map(m => parseInt(m[1]))
            )];

            if (issueNumbers.length === 0) {
              core.notice('No closes/fixes/resolves keywords in PR body');
              return;
            }

            for (const n of issueNumbers) {
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: n,
                });
                if (issue.data.state === 'closed') {
                  core.notice(`Issue #${n} already closed`);
                  continue;
                }
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: n,
                  state: 'closed',
                  state_reason: 'completed',
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: n,
                  body: `Resolved by PR #${pr.number} (merged to \`develop\`).`,
                });
                core.notice(`Closed issue #${n}`);
              } catch (e) {
                core.warning(`Failed to close #${n}: ${e.message}`);
              }
            }
