name: Backend CI - mobruji

on:
  pull_request:
    branches: [ "develop", "main" ]
    types: [ opened, synchronize, reopened ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    # NOTE: ADR 0003 적용 후 모든 테스트가 @ActiveProfiles("test") + H2를 사용.
    # MySQL 서비스 컨테이너와 SPRING_DATASOURCE_* env는 더 이상 필요 없음.
    # 향후 MySQL 방언 검증용 별도 integration job을 추가할 때 다시 도입.

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'gradle'
          cache-dependency-path: backend/*.gradle*

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Code Style And Format
        run: ./gradlew checkstyleMain spotlessCheck

      - name: Test with Gradle
        run: ./gradlew test

      - name: BootJar with Gradle
        run: ./gradlew bootJar -x test

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: 'backend/build/test-results/test/TEST-*.xml'

      - name: Comment failed code lines
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'backend/build/test-results/test/TEST-*.xml'
          token: ${{ github.token }}
