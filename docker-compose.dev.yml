# Phase 4 NCP dev 배포 — docs/features/ncp-dev-deployment.md §5-2.
#
# 운영 흐름:
#   sudo bash tools/deploy/ncp-bootstrap-dev.sh  # 최초 1회 (docker + swap)
#   cp .env.dev.example .env.dev && nano .env.dev  # 비밀번호 채우기
#   docker compose -f docker-compose.dev.yml --env-file .env.dev up -d --build
#
# 메모리 매트릭스 (NCP 4GB 합산 2.8GB):
#   mysql 512M + backend 600M + web 256M + nginx 64M + certbot 32M = 1.46GB
#
# HTTPS (ADR-0028): nip.io + Let's Encrypt. 최초 인증서 발급은 tools/deploy/dev-tls-init.sh
# 를 1회 실행해야 nginx 443 이 booting 가능 (certbot-certs volume 채움). 그 뒤 certbot
# container 가 12시간 주기로 자동 갱신, nginx 는 6시간 주기로 reload 하여 갱신본을 흡수.

services:
  mysql:
    image: mysql:8.4.6
    container_name: mobruji-mysql-dev
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env.dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mobruji}
      MYSQL_USER: ${MYSQL_USER:-mobruji}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env.dev}
      TZ: Asia/Seoul
    volumes:
      - mobruji-mysql-dev:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mobruji-dev

  backend:
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: mobruji/backend:${GIT_SHA:-dev}
    container_name: mobruji-backend-dev
    restart: unless-stopped
    mem_limit: 600m
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-mobruji}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env.dev}
      # admin endpoint 게이트 (#224/#228). dev 음역대 메타추정 트리거(#1788)도 이 토큰을 쓴다:
      #   curl -XPOST -H "X-Admin-Token: $MOBRUJI_ADMIN_TOKEN" \
      #     "https://<host>/api/v1/admin/songs/estimate-vocal-range?limit=20"
      # → 음역대 미보유 곡을 keyOriginal/genre 메타로 추정해 채워 추천 풀 진입 (응답: scanned/applied/...).
      MOBRUJI_ADMIN_TOKEN: ${MOBRUJI_ADMIN_TOKEN:?MOBRUJI_ADMIN_TOKEN must be set in .env.dev}
      MOBRUJI_CORS_ALLOWED_ORIGINS: ${MOBRUJI_CORS_ALLOWED_ORIGINS:-http://localhost}
      # allowPublicKeyRetrieval=true — MySQL 8.4 의 caching_sha2_password 가
      # useSSL=false 환경에서 public key 교환을 요구. dev 환경(internal docker
      # network)이라 plain text 비밀번호 전송이 격리됨.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mobruji}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      # 오디오 자체분석 DooD (#1797 / #1779) — 백엔드 컨테이너가 audio-analysis 컨테이너를
      # 형제(sibling)로 띄워(Docker-out-of-Docker) 호스트 Python 설치 없이 음역을 분석한다.
      # AudioAnalysisRunner 는 use-docker=true 일 때 호스트 docker 데몬(소켓 마운트)으로
      # `docker compose -f <compose> run --rm audio-analysis ...` 를 ProcessBuilder 로 호출한다.
      # (#1783 은 별도 overlay 로 배선했으나 cd-dev 가 base 만 사용해 미적용 — base 로 흡수)
      AUDIO_ANALYSIS_USE_DOCKER: "true"
      AUDIO_ANALYSIS_TOOL_DIR: ${HOST_PROJECT_DIR:?set HOST_PROJECT_DIR in .env.dev (repo 절대경로)}/tools/audio-analysis
      AUDIO_ANALYSIS_COMPOSE_FILE: ${HOST_PROJECT_DIR:?set HOST_PROJECT_DIR in .env.dev (repo 절대경로)}/docker-compose.audio.yml
      AUDIO_ANALYSIS_COMPOSE_SERVICE: audio-analysis
    # spring(uid 1001) 비-root user 가 root:docker 소유 소켓(660)에 접근하려면 docker 그룹 GID 를
    # supplementary group 으로 추가해야 한다. GID 는 호스트별로 다르므로 .env.dev 주입(bootstrap 자동 채움).
    # 값 확인: getent group docker | cut -d':' -f3
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env.dev (getent group docker | cut -d: -f3)}"
    volumes:
      # 호스트 docker 데몬 재사용(DooD). docker CLI + compose plugin 은 backend/Dockerfile 에 설치됨.
      - /var/run/docker.sock:/var/run/docker.sock
      # 호스트 경로 미러 — 컨테이너 내부 경로 == 호스트 경로가 되도록 ro 마운트하면, 내부에서 실행한
      # `docker compose -f ${HOST_PROJECT_DIR}/docker-compose.audio.yml run` 의 상대 bind/build
      # 컨텍스트(./tools/audio-analysis 등)가 호스트 데몬 기준으로 동일 절대경로로 정확히 풀린다.
      - ${HOST_PROJECT_DIR:?set HOST_PROJECT_DIR in .env.dev (repo 절대경로)}:${HOST_PROJECT_DIR:?set HOST_PROJECT_DIR in .env.dev (repo 절대경로)}:ro
    networks:
      - mobruji-dev

  web:
    build:
      context: ./web
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        # 빈 문자열이 default — 백엔드 컨트롤러가 /api/v1/... prefix 이미 보유하므로
        # base 는 host root. /api 로 두면 client 가 /api/api/... 로 합쳐
        # nginx → backend 404 (voice-range → 추천받기 P0 버그).
        # 자세한 결정은 .env.dev.example NEXT_PUBLIC_API_BASE_URL 주석 참조.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL-}
    image: mobruji/web:${GIT_SHA:-dev}
    container_name: mobruji-web-dev
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - backend
    environment:
      NODE_ENV: production
    networks:
      - mobruji-dev

  nginx:
    image: nginx:1.27-alpine
    container_name: mobruji-nginx-dev
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      - backend
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Let's Encrypt 인증서 (certbot 가 write, nginx 는 read) + ACME webroot.
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    # 6시간 주기 reload 로 certbot 가 갱신한 인증서를 무중단 흡수 (docker socket 공유 회피).
    command:
      - /bin/sh
      - -c
      - while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/_nginx_health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks:
      - mobruji-dev

  # Let's Encrypt 인증서 자동 갱신 (ADR-0028). 최초 발급은 tools/deploy/dev-tls-init.sh.
  # 12시간 주기 `certbot renew` — 만료 30일 전 자동 갱신 (Let's Encrypt 90일 만료).
  # nginx 는 별도 6시간 reload loop 로 갱신본을 흡수하므로 deploy-hook reload 불요.
  certbot:
    image: certbot/certbot:latest
    container_name: mobruji-certbot-dev
    restart: unless-stopped
    mem_limit: 32m
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint:
      - /bin/sh
      - -c
      - trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done
    networks:
      - mobruji-dev

volumes:
  mobruji-mysql-dev:
    name: mobruji-mysql-dev
  certbot-certs:
    name: mobruji-certbot-certs
  certbot-webroot:
    name: mobruji-certbot-webroot

networks:
  mobruji-dev:
    name: mobruji-dev
    driver: bridge
