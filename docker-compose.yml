services:
  mysql:
    image: mysql:8.4.6
    container_name: mobruji-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mobruji}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mobruji}
      MYSQL_USER: ${MYSQL_USER:-mobruji}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mobruji}
      TZ: Asia/Seoul
    ports:
      - "13306:3306"
    volumes:
      - mobruji-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-mobruji}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mobruji-mysql-data:
