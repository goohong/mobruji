  </defs>
  <rect width="512" height="512" rx="112" fill="url(#mobruji-favicon-grad)"/>
  <g filter="url(#mobruji-favicon-glow)" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <rect x="208" y="120" width="96" height="170" rx="48"/>
